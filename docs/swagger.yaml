openapi: 3.0.3
info:
  title: Flexi Roomz Admin API
  version: 1.0.0
  description: API documentation for the Flexi Roomz admin backend.
servers:
  - url: http://localhost:3000/api
    description: Local development server
tags:
  - name: Auth
    description: Authentication endpoints
  - name: Master Data
    description: Master data list endpoints (Amenities, Photo Categories, Expense Categories)
  - name: Areas
    description: Area master data management endpoints
  - name: Cities
    description: City master data management endpoints
  - name: PGs
    description: Pay guest listing and management endpoints
  - name: Rooms
    description: Room management endpoints for PGs
  - name: PG Photos
    description: Photo management endpoints for PG listings
  - name: Beds
    description: Bed management endpoints
  - name: Expenses
    description: Expense tracking endpoints
  - name: Tenants
    description: Tenant management endpoints
  - name: Bills
    description: Billing endpoints
  - name: Roles
    description: Role and permission management endpoints
  - name: Users
    description: User management endpoints
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /master/amenities:
    get:
      tags:
        - Master Data
      summary: Get all amenities list
      description: Retrieve all available amenities for PG listings
      responses:
        '200':
          description: List of amenities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Amenity'
                  error:
                    type: string
                    nullable: true

  /master/photo-categories:
    get:
      tags:
        - Master Data
      summary: Get all photo categories list
      description: Retrieve all available categories for PG photos
      responses:
        '200':
          description: List of photo categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhotoCategory'
                  error:
                    type: string
                    nullable: true

  /master/expense-categories:
    get:
      tags:
        - Master Data
      summary: Get all expense categories list
      description: Retrieve all available expense categories (Rent, Salary, Electricity, Water, etc.)
      responses:
        '200':
          description: List of expense categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseCategory'
                  error:
                    type: string
                    nullable: true

  /auth/login:
    post:
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/profile:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    put:
      summary: Change authenticated user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required:
                - currentPassword
                - newPassword
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cities:
    get:
      tags:
        - Cities
      summary: List all cities
      description: Retrieve all cities from the master data
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
          description: Number of cities to skip
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Maximum number of cities to return
      responses:
        '200':
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Cities
      summary: Create a new city
      description: Add a new city to the master data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityCreateRequest'
      responses:
        '201':
          description: City created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cities/{cityId}:
    get:
      tags:
        - Cities
      summary: Get city by ID
      security:
        - bearerAuth: []
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: City details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '404':
          description: City not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Cities
      summary: Update a city
      security:
        - bearerAuth: []
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityUpdateRequest'
      responses:
        '200':
          description: City updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '404':
          description: City not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Cities
      summary: Delete a city
      security:
        - bearerAuth: []
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: City deleted successfully
        '404':
          description: City not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cities/with-areas:
    get:
      tags:
        - Cities
      summary: Get all cities with their areas
      description: Retrieve all cities along with their associated areas, with pagination support
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
          description: Number of cities to skip
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Maximum number of cities to return
      responses:
        '200':
          description: Cities with areas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CityWithAreas'
                  pagination:
                    type: object
                    properties:
                      skip:
                        type: integer
                      limit:
                        type: integer
                      totalCount:
                        type: integer
                  error:
                    type: string
                    nullable: true

  /areas:
    get:
      tags:
        - Areas
      summary: List all areas
      description: Retrieve all areas from the master data
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
          description: Number of areas to skip
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Maximum number of areas to return
      responses:
        '200':
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Areas
      summary: Create a new area
      description: Add a new area to the master data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaCreateRequest'
      responses:
        '201':
          description: Area created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /areas/{areaId}:
    get:
      tags:
        - Areas
      summary: Get area by ID
      security:
        - bearerAuth: []
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Area details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '404':
          description: Area not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Areas
      summary: Update an area
      security:
        - bearerAuth: []
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaUpdateRequest'
      responses:
        '200':
          description: Area updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '404':
          description: Area not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Areas
      summary: Delete an area
      security:
        - bearerAuth: []
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Area deleted successfully
        '404':
          description: Area not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /areas/city/{cityId}:
    get:
      tags:
        - Areas
      summary: Get areas by city
      description: Retrieve all areas that belong to a specific city
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of areas for the city
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
        '404':
          description: City not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pgs:
    post:
      tags:
        - PGs
      summary: Create a new PG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGCreateRequest'
      responses:
        '201':
          description: PG created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PG'
    get:
      tags:
        - PGs
      summary: List all PGs
      responses:
        '200':
          description: PG list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PG'

  /pgs/{id}:
    get:
      tags:
        - PGs
      summary: Get PG by ID
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '200':
          description: PG details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PG'
    put:
      tags:
        - PGs
      summary: Update PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGUpdateRequest'
      responses:
        '200':
          description: PG updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PG'
    delete:
      tags:
        - PGs
      summary: Delete PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '204':
          description: PG deleted

  /pgs/{id}/status:
    patch:
      tags:
        - PGs
      summary: Change PG status
      parameters:
        - $ref: '#/components/parameters/PGId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - inactive
              required:
                - status
      responses:
        '200':
          description: PG status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PG'

  /pgs/{pgId}/rooms:
    post:
      summary: Create a room for a PG
      tags:
        - Rooms
      parameters:
        - $ref: '#/components/parameters/PGId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGRoomCreateRequest'
            example:
              roomType: Standard
              roomNumber: "101"
              totalBeds: 4
              availableBeds: 4
              pricePerBed: 5000
              acType: AC
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGRoom'
    get:
      summary: Get all rooms for a PG
      tags:
        - Rooms
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Rooms list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PGRoom'

  /pgs/{pgId}/rooms/{roomId}:
    get:
      summary: Get room by ID
      tags:
        - Rooms
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGRoom'
    put:
      summary: Update room
      tags:
        - Rooms
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGRoomUpdateRequest'
            example:
              roomType: Deluxe
              roomNumber: "101A"
              totalBeds: 5
              availableBeds: 3
              pricePerBed: 5500
              acType: AC
      responses:
        '200':
          description: Room updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGRoom'
    delete:
      summary: Delete room
      tags:
        - Rooms
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/RoomId'
      responses:
        '204':
          description: Room deleted

  /pgs/{pgId}/photos:
    post:
      tags:
        - PG Photos
      summary: Add a photo to a PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoUrl:
                  type: string
              required:
                - photoUrl
      responses:
        '201':
          description: Photo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGPhoto'
    get:
      tags:
        - PG Photos
      summary: List all photos for a PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '200':
          description: Photos list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PGPhoto'

  /pgs/{pgId}/photos/{photoId}:
    delete:
      tags:
        - PG Photos
      summary: Delete a PG photo
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '204':
          description: Photo deleted

  /pgs/{pgId}/rooms/{roomId}/beds:
    post:
      summary: Create a bed in a room
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGBedCreateRequest'
      responses:
        '201':
          description: Bed created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGBed'
    get:
      summary: List beds in a room
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Beds list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PGBed'

  /pgs/{pgId}/beds:
    get:
      summary: Get all beds for a PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '200':
          description: Beds list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PGBed'

  /pgs/{pgId}/rooms/{roomId}/beds/{bedId}:
    put:
      summary: Update a bed
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/BedId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGBedUpdateRequest'
      responses:
        '200':
          description: Bed updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGBed'
    delete:
      summary: Delete a bed
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/BedId'
      responses:
        '204':
          description: Bed deleted

  /pgs/{pgId}/expenses/summary:
    get:
      summary: Get expense summary for a PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '200':
          description: Expense summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalExpenses:
                    type: number
                  categories:
                    type: object
                    additionalProperties:
                      type: number

  /pgs/{pgId}/expenses:
    get:
      summary: List expenses for a PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '200':
          description: Expense list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
    post:
      summary: Create an expense for a PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'

  /pgs/{pgId}/expenses/{expenseId}:
    get:
      summary: Get expense by ID
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '200':
          description: Expense details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
    put:
      summary: Update an expense
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/ExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdateRequest'
      responses:
        '200':
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
    delete:
      summary: Delete an expense
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '204':
          description: Expense deleted

  /pgs/{pgId}/tenants:
    get:
      summary: List tenants in a PG
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
    post:
      summary: Create tenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

  /pgs/{pgId}/tenants/{id}:
    get:
      summary: Get tenant by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
    put:
      summary: Update a tenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
    patch:
      summary: Checkout a tenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
    delete:
      summary: Delete tenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '204':
          description: Tenant deleted

  /pgs/{pgId}/bills/generate:
    post:
      summary: Generate bills for a PG
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                month:
                  type: integer
                  description: Bill month (1-12)
                year:
                  type: integer
                  description: Bill year
                dueDate:
                  type: string
                  format: date
                  description: Due date for the bills
                extraItems:
                  type: array
                  description: Additional bill items for tenants
                  items:
                    type: object
                    properties:
                      tenantId:
                        type: integer
                      label:
                        type: string
                        enum: [Rent, Electricity, Water, Maintenance, Salary, Food, Internet, Other]
                      amount:
                        type: number
                    required:
                      - tenantId
                      - label
                      - amount
              required:
                - month
                - year
                - dueDate
      responses:
        '200':
          description: Bills generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      type: object
                      properties:
                        tenantId:
                          type: integer
                        name:
                          type: string
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        tenantId:
                          type: integer
                        name:
                          type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pgs/{pgId}/bills:
    get:
      summary: List bills for a PG
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '200':
          description: Bill list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bill'

  /pgs/{pgId}/bills/overdue:
    get:
      summary: Get overdue bills for a PG
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '200':
          description: Overdue bills list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bill'

  /pgs/{pgId}/bills/{billId}:
    get:
      summary: Get bill by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/BillId'
      responses:
        '200':
          description: Bill details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'

  /pgs/{pgId}/bills/{billId}/receipt:
    get:
      summary: Get bill receipt
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/BillId'
      responses:
        '200':
          description: Receipt details or URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiptUrl:
                    type: string
                  message:
                    type: string

  /pgs/{pgId}/bills/{billId}/payments:
    post:
      summary: Record a payment for a bill
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PGId'
        - $ref: '#/components/parameters/BillId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /bills:
    get:
      summary: List all bills with optional filtering
      security:
        - bearerAuth: []
      parameters:
        - name: pgId
          in: query
          schema:
            type: integer
          description: Filter bills by PG ID
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending, partial, paid, overdue]
          description: Filter bills by status
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
          description: Number of bills to skip for pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Maximum number of bills to return
      responses:
        '200':
          description: Bill list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bill'

  /users:
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    get:
      summary: List users
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/pgs/available:
    get:
      summary: Get available PGs for assignment
      responses:
        '200':
          description: Available PG list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PG'

  /users/pg/{pgId}:
    get:
      summary: Get users by PG
      parameters:
        - $ref: '#/components/parameters/PGId'
      responses:
        '200':
          description: Users for PG
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      summary: Update a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      summary: Delete a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted

  /users/{id}/status:
    patch:
      summary: Change user status
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - inactive
              required:
                - status
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    PGId:
      name: pgId
      in: path
      required: true
      schema:
        type: integer
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
    Skip:
      name: skip
      in: query
      required: false
      schema:
        type: integer
        default: 0
        example: 0
      description: Number of records to skip for pagination
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
        example: 10
      description: Maximum number of records to return
    BedId:
      name: bedId
      in: path
      required: true
      schema:
        type: integer
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: integer
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: integer
    BillId:
      name: billId
      in: path
      required: true
      schema:
        type: integer
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TenantId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
            - admin
            - super_admin
            - pg_owner
            - pg_staff
        status:
          type: string
          enum:
            - active
            - inactive
        pgId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        role:
          type: string
        pgId:
          type: integer
      required:
        - name
        - email
        - phone
        - password
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        role:
          type: string
        status:
          type: string
        pgId:
          type: integer
    PG:
      type: object
      properties:
        id:
          type: integer
        pgName:
          type: string
        ownerName:
          type: string
        ownerPhone:
          type: string
        ownerEmail:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        nearbyMark:
          type: string
          nullable: true
        areaId:
          type: integer
          nullable: true
          description: Reference ID for the selected area
        areaOther:
          type: string
          nullable: true
          description: Free-text area name when area is custom
        cityId:
          type: integer
          nullable: true
          description: Reference ID for the selected city
        cityOther:
          type: string
          nullable: true
          description: Free-text city name when city is custom
        state:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        pgType:
          type: string
          enum:
            - Boys
            - Girls
            - CoLiving
        numberOfRooms:
          type: integer
        isFoodAvailable:
          type: boolean
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PGCreateRequest:
      type: object
      properties:
        pgName:
          type: string
          description: Name of the PG
        ownerName:
          type: string
          description: Full name of the PG owner
        ownerPhone:
          type: string
          description: Contact phone number of the owner
        ownerEmail:
          type: string
          format: email
          description: Email address of the owner
        addressLine1:
          type: string
          description: Primary address line
        addressLine2:
          type: string
          nullable: true
          description: Secondary address line (optional)
        nearbyMark:
          type: string
          nullable: true
          description: Nearby landmark for easy identification (optional)
        areaId:
          type: integer
          nullable: true
          description: Reference ID for the selected area from the Areas master (optional)
        areaOther:
          type: string
          nullable: true
          description: Free-text area name when areaId is not provided or area is custom (optional)
        cityId:
          type: integer
          nullable: true
          description: Reference ID for the selected city from the Cities master (optional)
        cityOther:
          type: string
          nullable: true
          description: Free-text city name when cityId is not provided or city is custom (optional)
        state:
          type: string
          description: State/Province name
        latitude:
          type: number
          format: double
          description: Latitude coordinate of the PG location
        longitude:
          type: number
          format: double
          description: Longitude coordinate of the PG location
        pgType:
          type: string
          enum:
            - Boys
            - Girls
            - CoLiving
          description: Type of accommodation
        numberOfRooms:
          type: integer
          minimum: 1
          description: Total number of rooms in the PG
        isFoodAvailable:
          type: boolean
          description: Whether meals are provided (optional, defaults to false)
        amenityIds:
          type: array
          items:
            type: integer
          nullable: true
          description: Array of amenity IDs available in the PG (optional)
      required:
        - pgName
        - ownerName
        - ownerPhone
        - ownerEmail
        - addressLine1
        - state
        - latitude
        - longitude
        - pgType
        - numberOfRooms
      example:
        pgName: "Green Residency"
        ownerName: "Asha Verma"
        ownerPhone: "9876543210"
        ownerEmail: "asha@example.com"
        addressLine1: "12 MG Road"
        addressLine2: "Near Central Mall"
        nearbyMark: "Opposite City Bank"
